<style>
:root{--u:clamp(.88px,.2564vw,1.23px);--navy:#1249b8;--navy2:#2874f0;--org:#2874f0;--ink:#1a1d29;--mut:#7b8194;--line:#e6e9f2;--bg:#fff;--soft:#f3f5fa;--stage:#e9ecf4;--r:8px;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}
body{font-family:Poppins,system-ui,sans-serif;background:var(--stage);color:var(--ink);display:flex;justify-content:center;align-items:center}

.view{flex:1;overflow-y:auto;scrollbar-width:none;-ms-overflow-style:none;padding:calc(72*var(--u)) calc(16*var(--u)) calc(96*var(--u));animation:in .35s cubic-bezier(.2,.8,.2,1)}.view::-webkit-scrollbar,.sheet>div::-webkit-scrollbar{display:none;width:0}.sheet>div{scrollbar-width:none}

button:focus-visible,input:focus-visible,select:focus-visible{outline:calc(2*var(--u)) solid var(--org);outline-offset:calc(2*var(--u))}
h1{font-size:calc(22*var(--u));font-weight:600;line-height:1.25}h2{font-size:calc(15*var(--u));font-weight:600}
.row{display:flex;align-items:center;justify-content:space-between;gap:calc(8*var(--u))}
.mut{color:var(--mut);font-size:calc(12*var(--u))}

.sec{margin:calc(20*var(--u)) 0 calc(10*var(--u))}.sec a{font-size:calc(12*var(--u));color:var(--org);font-weight:500;cursor:pointer}
/* splash */
.splash{position:absolute;inset:0;z-index:20;background:#fff;display:flex;flex-direction:column;transition:transform .6s cubic-bezier(.7,0,.2,1)}
.splash.out{transform:translateY(-100%)}
.hero{flex:1.3;margin:calc(12*var(--u));border-radius:var(--r);background:linear-gradient(160deg,#fbf4e2,#f1dcaa);display:grid;place-items:center;overflow:hidden}
.hero svg{width:calc(150*var(--u));height:calc(150*var(--u));stroke:var(--navy);fill:none;stroke-width:1.2;animation:fl 3.2s ease-in-out infinite}
@keyframes fl{50%{transform:translateY(calc(-12*var(--u))) rotate(3deg)}}

.sp-b p{font-size:calc(12*var(--u));opacity:.75;margin:calc(8*var(--u)) 0 calc(22*var(--u))}
.dots{display:flex;gap:calc(6*var(--u));justify-content:center;margin-bottom:calc(14*var(--u))}.dots i{width:calc(6*var(--u));height:calc(6*var(--u));border-radius:calc(3*var(--u));background:#ffffff55}.dots i:first-child{width:calc(18*var(--u));background:var(--org)}
.btn{display:flex;align-items:center;justify-content:center;gap:calc(8*var(--u));width:100%;padding:calc(13*var(--u));border-radius:var(--r);font-weight:600;font-size:calc(14*var(--u));transition:transform .15s}
.btn:active{transform:scale(.97)}.w{background:#fff;color:var(--navy)}.o{background:var(--org);color:#fff}.n{background:var(--navy);color:#fff}.ol{border:1px solid var(--line)}
/* search + chips */
.search{display:flex;align-items:center;gap:calc(8*var(--u));border:1px solid var(--line);border-radius:var(--r);padding:0 calc(12*var(--u));height:calc(44*var(--u));color:var(--mut)}

.chips{display:flex;gap:calc(8*var(--u));overflow-x:auto;padding:calc(12*var(--u)) 0 calc(2*var(--u));scrollbar-width:none}.chips::-webkit-scrollbar{display:none}
.chip{padding:calc(8*var(--u)) calc(14*var(--u));border-radius:var(--r);border:1px solid var(--line);font-size:calc(12*var(--u));font-weight:500;white-space:nowrap;transition:.2s}
.chip.on{background:var(--navy);color:#fff;border-color:var(--navy)}
/* banner */
.ban{background:linear-gradient(120deg,var(--org),#ff9a5c);color:#fff;border-radius:var(--r);padding:calc(18*var(--u));display:flex;justify-content:space-between;align-items:center;position:relative;overflow:hidden}
.ban b{font-size:calc(18*var(--u));display:block;line-height:1.25;max-width:calc(190*var(--u))}.ban small{opacity:.9;font-size:calc(12*var(--u))}
.ban button{margin-top:calc(10*var(--u));background:#fff;color:var(--ink);padding:calc(7*var(--u)) calc(14*var(--u));border-radius:var(--r);font-size:calc(12*var(--u));font-weight:600}
.ban svg{position:absolute;right:calc(-6*var(--u));bottom:calc(-14*var(--u));width:calc(110*var(--u));height:calc(110*var(--u));opacity:.28;stroke:#fff;stroke-width:1.2;fill:none}
/* category icon grid */
.cg{display:grid;grid-template-columns:repeat(3,1fr);gap:calc(10*var(--u))}
.cat{border:1px solid var(--line);border-radius:var(--r);padding:calc(12*var(--u)) calc(6*var(--u));text-align:center;font-size:calc(11*var(--u));font-weight:500;display:flex;flex-direction:column;align-items:center;gap:calc(8*var(--u));transition:.2s}
.cat:active{transform:scale(.95)}.cat .ic{width:calc(40*var(--u));height:calc(40*var(--u));border-radius:var(--r);background:#faf3e3;color:var(--org);display:grid;place-items:center}
.cat .ic svg{width:calc(22*var(--u));height:calc(22*var(--u))}.cat span.c{color:var(--mut);font-weight:400;font-size:calc(10*var(--u))}
/* product cards */
.grid{display:grid;grid-template-columns:1fr 1fr;gap:calc(12*var(--u))}
.card{background:#fff;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;text-align:left;position:relative;transition:transform .2s,box-shadow .2s;animation:pop .4s both}
@keyframes pop{from{opacity:0;transform:scale(.94)}}
.card:active{transform:scale(.97)}
.card .im{aspect-ratio:1/.85;background:var(--soft);display:grid;place-items:center;color:var(--navy)}
.card .im svg{width:calc(46*var(--u));height:calc(46*var(--u));stroke-width:1.3}
.card .bd{padding:calc(10*var(--u))}.card .nm{font-size:calc(13*var(--u));font-weight:600;line-height:1.3}.card .br{font-size:calc(11*var(--u));color:var(--mut);margin:calc(2*var(--u)) 0 calc(8*var(--u))}
.card .pr{font-size:calc(12*var(--u));font-weight:600;color:var(--org)}
.add{width:calc(30*var(--u));height:calc(30*var(--u));border-radius:var(--r);background:var(--org);color:#fff;display:grid;place-items:center;transition:transform .2s}
.add:active{transform:scale(.8) rotate(90deg)}.add.done{background:#1f9d62}
.heart{position:absolute;top:calc(8*var(--u));right:calc(8*var(--u));width:calc(30*var(--u));height:calc(30*var(--u));border-radius:var(--r);background:#fff;display:grid;place-items:center;color:var(--mut);box-shadow:0 1px calc(4*var(--u)) #0002}
.heart.on{color:#e5384f}.heart.on svg{fill:#e5384f;animation:beat .4s}
@keyframes beat{50%{transform:scale(1.4)}}
.hs{display:flex;gap:calc(12*var(--u));overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:calc(4*var(--u));scrollbar-width:none}.hs .card{min-width:calc(150*var(--u));scroll-snap-align:start}
/* wide card (careers / list) */
.wide{display:flex;gap:calc(12*var(--u));align-items:center;padding:calc(12*var(--u));border:1px solid var(--line);border-radius:var(--r);background:#fff;width:100%;text-align:left;margin-bottom:calc(10*var(--u));animation:pop .4s both}
.wide .ic{width:calc(44*var(--u));height:calc(44*var(--u));border-radius:var(--r);background:var(--navy);color:#fff;display:grid;place-items:center}
.tag{display:inline-block;font-size:calc(10*var(--u));padding:calc(3*var(--u)) calc(8*var(--u));border-radius:var(--r);background:#faf3e3;color:#8a5d0a;font-weight:500;margin:calc(6*var(--u)) calc(4*var(--u)) 0 0}
.tag.b{background:#e8edfb;color:var(--navy2)}
/* bottom nav (ref 3) */
.nav{position:absolute;left:0;right:0;bottom:0;background:var(--navy);display:flex;justify-content:space-around;padding:calc(10*var(--u)) calc(8*var(--u)) calc(calc(10*var(--u)) + env(safe-area-inset-bottom,calc(0*var(--u))));border-radius:0;z-index:10}
.nav button{color:#ffffff88;display:flex;flex-direction:column;align-items:center;gap:calc(3*var(--u));font-size:calc(10*var(--u));padding:calc(4*var(--u)) calc(14*var(--u));position:relative;transition:color .25s}
.nav button.on{color:#fff}.nav button.on svg{transform:translateY(calc(-3*var(--u))) scale(1.12);color:var(--org)}.nav svg{transition:transform .3s cubic-bezier(.3,1.6,.5,1)}
.nav button.on::after{content:"";position:absolute;bottom:calc(-4*var(--u));width:calc(16*var(--u));height:calc(3*var(--u));border-radius:calc(2*var(--u));background:var(--org)}
.nav{transition:transform .35s cubic-bezier(.2,.8,.2,1)}.nav.hide{transform:translateY(105%)}
.top{position:absolute;top:0;left:0;right:0;z-index:10;background:#fff;display:flex;align-items:center;justify-content:space-between;padding:calc(10*var(--u)) calc(16*var(--u));border-bottom:1px solid var(--line);transition:transform .35s cubic-bezier(.2,.8,.2,1)}.top.hide{transform:translateY(-105%)}
.logo{display:flex;align-items:center;gap:calc(8*var(--u));font-weight:600;font-size:calc(15*var(--u))}.logo i{width:calc(32*var(--u));height:calc(32*var(--u));border-radius:var(--r);background:var(--org);color:#fff;display:grid;place-items:center}
.tbs{display:flex;align-items:center;gap:calc(4*var(--u))}.tb{width:calc(36*var(--u));height:calc(36*var(--u));border-radius:var(--r);display:grid;place-items:center;position:relative;color:var(--ink);transition:background .2s}.tb:active{background:var(--soft)}.tb .bdg{top:calc(-2*var(--u));right:calc(-2*var(--u))}
.av{width:calc(34*var(--u));height:calc(34*var(--u));border-radius:50%;background:var(--navy);color:#fff;font-size:calc(12*var(--u));font-weight:600;display:grid;place-items:center;margin-left:calc(4*var(--u))}
.bdg{position:absolute;top:0;right:calc(8*var(--u));min-width:calc(16*var(--u));height:calc(16*var(--u));border-radius:calc(8*var(--u));background:var(--org);color:#fff;font-size:calc(10*var(--u));display:grid;place-items:center;padding:0 calc(4*var(--u))}.bdg.pulse{animation:beat .4s}
/* detail */
.back{display:flex;align-items:center;gap:calc(6*var(--u));font-size:calc(13*var(--u));font-weight:500;margin-bottom:calc(12*var(--u))}
.big{height:calc(220*var(--u));border-radius:var(--r);background:linear-gradient(160deg,#eef1fa,#dfe5f5);display:grid;place-items:center;color:var(--navy);position:relative}
.big svg{width:calc(96*var(--u));height:calc(96*var(--u));stroke-width:1.1;animation:fl 4s ease-in-out infinite}
.spec{display:grid;grid-template-columns:1fr 1fr;gap:calc(8*var(--u));margin-top:calc(10*var(--u))}.spec div{background:var(--soft);border-radius:var(--r);padding:calc(10*var(--u));font-size:calc(12*var(--u))}.spec b{display:block;font-size:calc(10*var(--u));color:var(--mut);font-weight:500}
.step{display:flex;align-items:center;gap:calc(6*var(--u))}.step button{width:calc(28*var(--u));height:calc(28*var(--u));border-radius:var(--r);border:1px solid var(--line);display:grid;place-items:center}.step span{min-width:calc(20*var(--u));text-align:center;font-weight:600;font-size:calc(13*var(--u))}
.step.d button{background:var(--navy);color:#fff;border-color:var(--navy)}
.ci{display:flex;gap:calc(12*var(--u));align-items:center;padding:calc(10*var(--u));border:1px solid var(--line);border-radius:var(--r);margin-bottom:calc(10*var(--u));animation:pop .35s both}
.ci .im{width:calc(56*var(--u));height:calc(56*var(--u));border-radius:var(--r);background:var(--soft);display:grid;place-items:center;color:var(--navy)}
.fld{display:block;margin-bottom:calc(10*var(--u));font-size:calc(12*var(--u));font-weight:500}.fld input,.fld select{width:100%;margin-top:calc(4*var(--u));height:calc(42*var(--u));border:1px solid var(--line);border-radius:var(--r);padding:0 calc(12*var(--u));font:inherit;font-size:calc(13*var(--u));background:#fff;color:var(--ink)}
.fld input.bad{border-color:#e5384f}
.ok{text-align:center;padding:calc(50*var(--u)) calc(10*var(--u))}.ok .ck{width:calc(76*var(--u));height:calc(76*var(--u));border-radius:50%;background:#e7f6ee;color:#1f9d62;display:grid;place-items:center;margin:0 auto calc(16*var(--u));animation:pop .5s both}.ok .ck svg{width:calc(38*var(--u));height:calc(38*var(--u));stroke-dasharray:40;animation:dr .6s .2s both}
@keyframes dr{from{stroke-dashoffset:40}to{stroke-dashoffset:0}}
.ref{display:inline-block;margin:calc(12*var(--u)) 0;padding:calc(8*var(--u)) calc(14*var(--u));border-radius:var(--r);background:var(--soft);font-weight:600;letter-spacing:calc(.5*var(--u))}
.empty{text-align:center;color:var(--mut);font-size:calc(13*var(--u));padding:calc(40*var(--u)) calc(10*var(--u))}
.sheet{position:absolute;inset:0;background:#0b122866;z-index:30;display:flex;align-items:flex-end;animation:fd .25s}
.sheet>div{background:#fff;width:100%;border-radius:var(--r) var(--r) 0 0;padding:calc(18*var(--u)) calc(16*var(--u)) calc(24*var(--u));animation:up .35s cubic-bezier(.2,.8,.2,1);max-height:90%;overflow:auto}
@keyframes fd{from{opacity:0}}@keyframes up{from{transform:translateY(100%)}}

.demo{font-size:calc(10*var(--u));background:#fff6d6;color:#7a5b00;border-radius:var(--r);padding:calc(6*var(--u)) calc(10*var(--u));margin-bottom:calc(12*var(--u))}

/* premium theme */
.o,.add,.bdg{background:linear-gradient(135deg,#e6b655,#bb8a25);color:#1b1405}

if(a=='close'&&e.target.closest('.sheet>div')&&!e.target.closest('button'))return;

document.addEventListener('change',e=>{const i=e.target;if(i.type!=='file'||!i.files[0])return;const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,480/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*k;c.height=im.height*k;c.getContext('2d').drawImage(im,0,0,c.width,c.height);S.tmpImg=c.toDataURL('image/webp',.82);const v=$('#pv');if(v)v.innerHTML='<img src="'+S.tmpImg+'" alt="Preview">'};im.src=r.result};r.readAsDataURL(i.files[0])});

function carTo(c,i,anim=true){const t=c.querySelector('.trk'),n=+c.dataset.n;t.style.transition=anim?'':'none';t.style.transform='translateX('+(-i*100)+'%)';c.dataset.i=i;c.querySelectorAll('.d').forEach((d,k)=>d.classList.toggle('on',k==i%n));if(!anim)void t.offsetWidth}
function carNext(c){const n=+c.dataset.n,i=+c.dataset.i+1;carTo(c,i);if(i>=n)setTimeout(()=>{if(c.isConnected&&+c.dataset.i>=n)carTo(c,0,false)},650)}
setInterval(()=>{document.querySelectorAll('.car').forEach((c,k)=>{if(!c.dataset.hold)carNext(c)})},3500);
let tx=null,tc=null;document.addEventListener('touchstart',e=>{const c=e.target.closest('.car');if(c){tc=c;tx=e.touches[0].clientX;c.dataset.hold=1}},{passive:true});
document.addEventListener('touchend',e=>{const c=tc;if(!c||tx===null)return;const dx=e.changedTouches[0].clientX-tx;tx=null;tc=null;setTimeout(()=>delete c.dataset.hold,2500);const n=+c.dataset.n;if(dx<-40)carNext(c);else if(dx>40){const i=+c.dataset.i;carTo(c,i>0?i-1:n-1,i>0)}},{passive:true});
let lastY=0;document.addEventListener('scroll',e=>{const v=e.target;if(!v.classList||!v.classList.contains('view'))return;const y=v.scrollTop,n=document.querySelectorAll('.nav,.top');if(!n.length)return;if(y>lastY+6&&y>60)n.forEach(x=>x.classList.add('hide'));else if(y<lastY-6||y<=60)n.forEach(x=>x.classList.remove('hide'));lastY=y},true);
document.addEventListener('click',e=>{if(e.target.closest('#go')){const s=$('#sp');s.classList.add('out');setTimeout(()=>s.remove(),650)}});
